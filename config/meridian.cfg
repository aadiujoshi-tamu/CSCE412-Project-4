# Meridian Cloud simulation settings
initial_servers=20
clock_cycles=100000
initial_requests_per_server=100

# Request generation
request_time_min=10
request_time_max=100
random_seed=12345
arrival_probability=0.10
arrival_batch_min=1
arrival_batch_max=5

# Dynamic scaling
lower_queue_threshold=50
upper_queue_threshold=80
scaling_cooldown=100
min_servers=1
max_servers=100
scaling_enabled=true

# Logging (consumed by the Logger phase)
log_mode=quiet
log_file=logs/simulation.log
enable_colors=true

# CIDR firewall rules; repeat the key or provide comma-separated ranges.
blocked_ranges=10.0.0.0/16,192.168.50.0/24
