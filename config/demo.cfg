# Short, visible scenario for the recorded demonstration.
initial_servers=5
clock_cycles=120
initial_requests_per_server=120

# Shorter jobs make completions visible during the recording.
request_time_min=10
request_time_max=25
random_seed=24680
arrival_probability=0.25
arrival_batch_min=1
arrival_batch_max=3

# The initial queue is expected to trigger scale-up. New load can trigger
# additional changes during the short run.
lower_queue_threshold=50
upper_queue_threshold=80
scaling_cooldown=15
min_servers=1
max_servers=20
scaling_enabled=true

log_mode=verbose
log_file=logs/demo.log
enable_colors=true

# A broad demo-only rule makes firewall rejections visible in a short run.
blocked_ranges=0.0.0.0/2
